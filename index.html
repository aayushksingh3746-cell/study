<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Math Tracker</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f5; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #18181b; margin-top: 0; }
        label { display: block; margin-top: 16px; font-weight: 500; font-size: 14px; color: #3f3f46; }
        input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #d4d4d8; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #2563eb; color: white; padding: 12px; margin-top: 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #93c5fd; cursor: not-allowed; }
        #status { margin-top: 16px; text-align: center; font-size: 14px; font-weight: 500; }
    </style>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Image Compression Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
</head>
<body>

<div class="container">
    <h2>Daily Math Log</h2>
    <form id="studyForm">
        <label>Roll Number</label>
        <input type="number" id="rollNumber" required placeholder="e.g., 14">

        <label>Questions Solved Today</label>
        <input type="number" id="questions" required placeholder="Target: 10">

        <label>Time Spent (Minutes)</label>
        <input type="number" id="time" required placeholder="e.g., 45">

        <label>Proof of Practice</label>
        <!-- The "capture" attribute opens the camera directly on mobile phones -->
        <input type="file" id="proofImage" accept="image/*" capture="environment" required>

        <button type="submit" id="submitBtn">Submit Log</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // --- SETUP YOUR SUPABASE CONNECTION HERE ---
    const SUPABASE_URL = 'PASTE_YOUR_PROJECT_URL_HERE'; 
    const SUPABASE_ANON_KEY = 'Sb_publishable_2JdmwLqNrxTa4AerZThdJA_hqWExyhc'; // Your provided key
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('studyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        const rollNumber = document.getElementById('rollNumber').value;
        const questions = document.getElementById('questions').value;
        const time = document.getElementById('time').value;
        const imageFile = document.getElementById('proofImage').files[0];

        btn.disabled = true;
        btn.innerText = "Compressing Image...";
        status.style.color = "blue";
        status.innerText = "Processing...";

        try {
            // 1. Compress the image before uploading (saves storage)
            const options = { maxSizeMB: 0.5, maxWidthOrHeight: 1200, useWebWorker: true };
            const compressedFile = await imageCompression(imageFile, options);

            // 2. Upload to Supabase Storage
            btn.innerText = "Uploading to Database...";
            const fileName = `${rollNumber}-${Date.now()}.jpg`;
            
            const { data: uploadData, error: uploadError } = await supabase.storage
                .from('homework-proofs')
                .upload(fileName, compressedFile);

            if (uploadError) throw uploadError;

            // Get the public URL of the uploaded image
            const { data: urlData } = supabase.storage
                .from('homework-proofs')
                .getPublicUrl(fileName);

            // 3. Save the record to your database table
            btn.innerText = "Saving Record...";
            const { error: dbError } = await supabase
                .from('daily_study_logs')
                .insert([{
                    student_roll_number: parseInt(rollNumber),
                    questions_solved: parseInt(questions),
                    study_time_minutes: parseInt(time),
                    proof_image_url: urlData.publicUrl
                }]);

            if (dbError) throw dbError;

            // Success
            status.style.color = "green";
            status.innerText = "✅ Successfully submitted! Great job today.";
            document.getElementById('studyForm').reset();

        } catch (error) {
            console.error(error);
            status.style.color = "red";
            if (error.code === '23505') {
                status.innerText = "❌ You have already submitted a log for today!";
            } else {
                status.innerText = "❌ Error: " + error.message;
            }
        } finally {
            btn.disabled = false;
            btn.innerText = "Submit Log";
        }
    });
</script>

</body>
</html>
